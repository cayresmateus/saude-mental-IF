<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <header class=" d-flex justify-content-between p-2 align-items-center">
        <img src="./assets/Sem título.png" alt="">
        <a class="titulo" href="/index.html">Ambiente Escolar e Saúde Mental -- O IF que queremos construir</a>
        <a href="./cadastro.html" class="btn btn-primary">Cadastrar</a>
    </header>
    <main class="d-flex justify-content-between px-4 flex-1  ">
        <form action="" >
            <h1>Formulário de contato</h1>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input class="form-control" id="nome" type="text"  >
                <span class="error-message" id="nome-error"></span>
            </div>    
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input class="form-control" id="email" type="email" >
                <span class="error-message" id="email-error"></span>
            </div>
            
            <div class="form-group">
                <label for="contato">WhatsApp:</label>
                <input class="form-control" id="contato" type="text" placeholder="(99)99999-9999" >
                <span class="error-message" id="contato-error"></span>
            </div>
            
            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea class="form-control" id="mensagem" rows="3"></textarea>
                <span class="error-message" id="mensagem-error"></span>
            </div>
            
            
            <button onclick=" return validarFormulario()" class="btn btn-success mt-2" type="submit">Enviar</button>
        </form>
        
        <div class="mural d-flex flex-column">
            <h1>Mural de Ideias</h1>
            <div class="d-flex justify-content-between ">
                <input class="form-control" id="ideia" type="text" placeholder="Escreva uma ideia" >
                <button class="btn btn-primary" id="inserir">Inserir</button>
                <button class="btn btn-danger " id="remover" >Remover último</button>
            </div>
            <ul class="mt-2 ideias-lista">
                
            </ul>
        </div>
    </main>
<script src="cadastro.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
